xml
<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catalogo</title>

<style>
:root{
  --background:#f8f7f4;
  --surface:#ffffff;
  --text:#292724;
  --muted:#625b53;
  --line:#e5dfd6;
  --accent:#433a31;
}

*{
  box-sizing:border-box;
}

[hidden]{
  display:none !important;
}

body{
  margin:0;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,
    "Segoe UI",sans-serif;
  color:var(--text);
  background:var(--background);
}

button,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

button:focus-visible,
select:focus-visible,
a:focus-visible{
  outline:3px solid #a88a63;
  outline-offset:4px;
}

header{
  position:sticky;
  top:0;
  z-index:10;
  background:var(--background);
  border-bottom:1px solid var(--line);
}

.head{
  max-width:1120px;
  margin:auto;
  padding:16px 20px;
}

.brand{
  margin:0 0 14px;
  font-family:Georgia,serif;
  font-size:30px;
  font-weight:400;
  letter-spacing:.03em;
}

.controls{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:3px 0 8px;
  scrollbar-width:thin;
}

.filter{
  flex-shrink:0;
  min-height:44px;
  padding:10px 16px;
  border:1px solid #d3c9bc;
  border-radius:100px;
  color:var(--accent);
  background:var(--surface);
}

.filter[aria-pressed="true"]{
  color:#fff;
  background:var(--accent);
  border-color:var(--accent);
}

.filter:active,
.more-control:active{
  opacity:.75;
}

.material-row{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:8px 12px;
  margin-top:6px;
}

.material-label{
  font-size:13px;
  color:var(--muted);
}

.material{
  min-height:44px;
  max-width:100%;
  padding:8px 34px 8px 12px;
  border:1px solid #d3c9bc;
  border-radius:8px;
  background:var(--surface);
  color:var(--text);
}

main{
  max-width:1120px;
  margin:auto;
  padding:24px 20px 72px;
}

.status{
  margin:0 0 20px;
  color:var(--muted);
  font-size:14px;
}

/* Un solo prodotto per riga, anche su computer. */
.catalog{
  display:flex;
  flex-direction:column;
  gap:36px;
}

.product{
  overflow:hidden;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:10px;
}

.info{
  padding:24px;
}

.eyebrow{
  font-size:13px;
  line-height:1.5;
  letter-spacing:.06em;
  color:var(--muted);
  overflow-wrap:anywhere;
}

.name{
  margin:9px 0 12px;
  font-family:Georgia,serif;
  font-size:28px;
  font-weight:400;
  line-height:1.2;
}

.details,
.note{
  margin:0;
  color:var(--muted);
  line-height:1.6;
}

.note{
  margin-top:8px;
  white-space:pre-line;
}

/* Area fotografica bianca: nessuna fascia grigia. */
.gallery-shell{
  background:#fff;
}

.gallery-viewport{
  overflow:hidden;
}

.gallery-track{
  display:flex;
  align-items:stretch;
  transition:transform .3s ease;
}

.slide{
  flex:0 0 50%;
  min-width:0;
  padding:0;
  border:0;
  margin:0;
  background:#fff;
}

.slide:only-child{
  flex-basis:100%;
}

.photo-button{
  display:block;
  width:100%;
  height:100%;
  padding:0;
  border:0;
  background:#fff;
  cursor:zoom-in;
}

.photo{
  display:block;
  width:100%;
  height:auto;
  aspect-ratio:1;
  object-fit:contain;
  background:#fff;
}

/* Una singola foto non diventa eccessivamente grande. */
.slide:only-child .photo{
  max-height:680px;
}

.gallery-controls{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:18px;
  padding:16px;
  background:#fff;
}

.more-control{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:48px;
  height:48px;
  padding:0;
  border:1px solid #d3c9bc;
  border-radius:50%;
  background:#fff;
  color:var(--accent);
  font-size:25px;
}

.more-control:disabled{
  opacity:.3;
  cursor:default;
}

.gallery-count{
  min-width:100px;
  text-align:center;
  font-size:14px;
  color:var(--muted);
}

.empty{
  margin:0;
  padding:28px;
  border:1px solid var(--line);
  border-radius:10px;
  background:#fff;
  line-height:1.6;
}

/* Galleria ingrandita. */
dialog{
  width:min(94vw,1100px);
  max-width:94vw;
  max-height:94dvh;
  margin:auto;
  padding:0;
  border:1px solid #ddd;
  border-radius:10px;
  background:#fff;
  color:var(--text);
}

dialog::backdrop{
  background:rgba(0,0,0,.78);
}

.viewer{
  padding:12px;
}

.viewer-image{
  display:block;
  width:100%;
  height:72dvh;
  object-fit:contain;
  background:#fff;
}

.viewer-error{
  padding:40px 20px;
  text-align:center;
  color:var(--muted);
}

.viewerbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding-top:12px;
}

.viewerbar button{
  min-width:48px;
  min-height:48px;
  padding:8px 14px;
  border:1px solid #d3c9bc;
  border-radius:8px;
  background:#fff;
  color:var(--text);
}

.viewerbar button:disabled{
  opacity:.3;
  cursor:default;
}

.viewer-counter{
  text-align:center;
  color:var(--muted);
  font-size:14px;
}

/* Smartphone: tutte le immagini in verticale. */
@media(max-width:699px){
  .head{
    padding:12px 14px;
  }

  .brand{
    font-size:26px;
    margin-bottom:10px;
  }

  main{
    padding:20px 12px 48px;
  }

  .catalog{
    gap:28px;
  }

  .info{
    padding:20px 18px;
  }

  .name{
    font-size:25px;
  }

  .gallery-track{
    display:block;
    transform:none !important;
    transition:none;
  }

  .slide{
    width:100%;
  }

  .photo{
    width:100%;
    height:auto;
    aspect-ratio:auto;
    max-height:none;
  }

  .slide:only-child .photo{
    max-height:none;
  }

  .gallery-controls{
    display:none !important;
  }

  .viewer-image{
    height:65dvh;
  }
}

@media(prefers-reduced-motion:reduce){
  .gallery-track{
    transition:none;
  }
}
</style>
</head>

<body>

<header>
  <div class="head">
    <h1 class="brand">Catalogo</h1>

    <nav
      id="filters"
      class="controls"
      aria-label="Filtra per tipo di gioiello"
    ></nav>

    <div class="material-row">
      <label for="material" class="material-label">
        Materiale
      </label>

      <select id="material" class="material">
        <option value="">Tutti i materiali</option>
      </select>
    </div>
  </div>
</header>

<main>
  <p id="status" class="status" role="status">
    Caricamento catalogo…
  </p>

  <div id="catalog" class="catalog"></div>
</main>

<dialog id="dialog" aria-label="Fotografie del gioiello">
  <div class="viewer">
    <img id="large" class="viewer-image" alt="">

    <p id="viewer-error" class="viewer-error" hidden>
      Questa fotografia non è disponibile.
    </p>

    <div class="viewerbar">
      <button
        id="viewer-prev"
        type="button"
        aria-label="Fotografia precedente"
      >←</button>

      <span id="viewer-counter" class="viewer-counter"></span>

      <button
        id="viewer-next"
        type="button"
        aria-label="Fotografia successiva"
      >→</button>

      <button id="viewer-close" type="button">
        Chiudi
      </button>
    </div>
  </div>
</dialog>

<script>
'use strict';

const labels = {
  C:'Collane',
  B:'Bracciali',
  O:'Orecchini',
  S:'Spille'
};

const catalog = document.querySelector('#catalog');
const statusNode = document.querySelector('#status');
const filters = document.querySelector('#filters');
const material = document.querySelector('#material');

const dialog = document.querySelector('#dialog');
const large = document.querySelector('#large');
const viewerError = document.querySelector('#viewer-error');
const viewerPrev = document.querySelector('#viewer-prev');
const viewerNext = document.querySelector('#viewer-next');
const viewerCounter = document.querySelector('#viewer-counter');
const viewerClose = document.querySelector('#viewer-close');

let products = [];
let selectedKind = '';

let activeGallery = [];
let activeIndex = 0;
let activeName = '';

function element(tag, className, text){
  const node = document.createElement(tag);

  if(className){
    node.className = className;
  }

  if(text !== undefined){
    node.textContent = text;
  }

  return node;
}

/*
 * Ricava il blocco prezzo dal catalogo o dai nomi originali.
 * Non richiede modifiche allo script Python.
 */
function originalPriceBlock(product){
  const explicit = String(product.prezzo_codice || '');

  if(/^[0-9x]{8}$/i.test(explicit)){
    return explicit;
  }

  const idParts = String(product.id || '').split('-');
  const fromId = idParts[4] || '';

  if(/^[0-9x]{8}$/i.test(fromId)){
    return fromId;
  }

  const firstPhoto = (product.foto || [])[0];

  if(firstPhoto){
    const filename = String(firstPhoto)
      .split('/')
      .pop()
      .split('?')[0];

    const photoParts = filename.split('-');
    const fromPhoto = photoParts[4] || '';

    if(/^[0-9x]{8}$/i.test(fromPhoto)){
      return fromPhoto;
    }
  }

  return '';
}

/*
 * Esempio:
 * 50268215 -> 026821 -> 26821
 * codice visibile: C00002-78526821
 */
function displayCode(product){
  const code = String(product.codice || '');
  const block = originalPriceBlock(product);

  if(/^[0-9]{8}$/.test(block)){
    const cents = String(Number(block.slice(1, -1)));
    return `${code}-785${cents}`;
  }

  /*
   * Senza prezzo numerico, mantiene il codice semplice.
   * Non inventa un importo per i prodotti con x.
   */
  return code;
}

function availablePhotos(product){
  return product.foto.filter(
    src => !product.failedPhotos.has(src)
  );
}

function openViewer(product, source){
  activeGallery = availablePhotos(product);
  activeIndex = activeGallery.indexOf(source);
  activeName = product.nome || 'Gioiello';

  if(activeIndex < 0 || !activeGallery.length){
    return;
  }

  updateViewer();

  if(!dialog.open){
    dialog.showModal();
  }
}

function updateViewer(){
  large.hidden = false;
  viewerError.hidden = true;

  large.alt =
    `${activeName}, fotografia ${activeIndex + 1}`;

  large.src = activeGallery[activeIndex];

  viewerCounter.textContent =
    `${activeIndex + 1} / ${activeGallery.length}`;

  viewerPrev.disabled = activeIndex === 0;
  viewerNext.disabled =
    activeIndex === activeGallery.length - 1;
}

large.addEventListener('error', () => {
  large.hidden = true;
  viewerError.hidden = false;
});

viewerPrev.addEventListener('click', () => {
  if(activeIndex > 0){
    activeIndex--;
    updateViewer();
  }
});

viewerNext.addEventListener('click', () => {
  if(activeIndex < activeGallery.length - 1){
    activeIndex++;
    updateViewer();
  }
});

viewerClose.addEventListener('click', () => {
  dialog.close();
});

dialog.addEventListener('keydown', event => {
  if(event.key === 'ArrowLeft' && activeIndex > 0){
    event.preventDefault();
    activeIndex--;
    updateViewer();
  }

  if(
    event.key === 'ArrowRight' &&
    activeIndex < activeGallery.length - 1
  ){
    event.preventDefault();
    activeIndex++;
    updateViewer();
  }
});

function makeGallery(product){
  const shell = element('div', 'gallery-shell');
  const viewport = element('div', 'gallery-viewport');
  const track = element('div', 'gallery-track');

  const controls = element('div', 'gallery-controls');
  const previous = element('button', 'more-control', '←');
  const counter = element('span', 'gallery-count');
  const next = element('button', 'more-control', '→');

  previous.type = 'button';
  next.type = 'button';

  previous.setAttribute(
    'aria-label',
    `Foto precedenti di ${product.nome}`
  );

  next.setAttribute(
    'aria-label',
    `Foto successive di ${product.nome}`
  );

  counter.setAttribute('aria-live', 'polite');

  let position = 0;

  function updatePosition(){
    const count = track.children.length;
    const maximum = Math.max(0, count - 2);

    position = Math.min(Math.max(position, 0), maximum);

    track.style.transform =
      `translateX(-${position * 50}%)`;

    previous.disabled = position === 0;
    next.disabled = position === maximum;

    controls.hidden = count <= 2;

    if(count){
      counter.textContent =
        `${position + 1}–${Math.min(position + 2, count)} / ${count}`;
    }
  }

  previous.addEventListener('click', () => {
    position--;
    updatePosition();
  });

  next.addEventListener('click', () => {
    position++;
    updatePosition();
  });

  availablePhotos(product).forEach((source, index) => {
    const slide = element('div', 'slide');
    const button = element('button', 'photo-button');
    const image = element('img', 'photo');

    button.type = 'button';
    button.setAttribute(
      'aria-label',
      `Ingrandisci la fotografia ${index + 1} di ${product.nome}`
    );

    image.alt =
      `${product.nome}, fotografia ${index + 1}`;

    image.loading = 'lazy';
    image.decoding = 'async';
    image.src = source;

    button.addEventListener('click', () => {
      openViewer(product, source);
    });

    image.addEventListener('error', () => {
      product.failedPhotos.add(source);
      slide.remove();
      updatePosition();

      if(!availablePhotos(product).length){
        render();
      }
    }, {once:true});

    button.append(image);
    slide.append(button);
    track.append(slide);
  });

  controls.append(previous, counter, next);
  viewport.append(track);
  shell.append(viewport, controls);

  updatePosition();

  return shell;
}

function render(){
  catalog.replaceChildren();

  const selected = products.filter(product => {
    return (
      (!selectedKind || product.tipo === selectedKind) &&
      (!material.value || product.materiale === material.value) &&
      availablePhotos(product).length > 0
    );
  });

  statusNode.textContent =
    `${selected.length} ${
      selected.length === 1 ? 'gioiello' : 'gioielli'
    }`;

  if(!selected.length){
    catalog.append(
      element(
        'p',
        'empty',
        products.length
          ? 'Nessun gioiello disponibile per questi filtri.'
          : 'Il catalogo non contiene ancora prodotti con fotografie.'
      )
    );

    return;
  }

  selected.forEach(product => {
    const card = element('article', 'product');
    const info = element('div', 'info');

    const heading = element(
      'div',
      'eyebrow',
      `${labels[product.tipo] || 'Gioiello'} · ${displayCode(product)}`
    );

    const name = element(
      'h2',
      'name',
      product.nome || 'Gioiello'
    );

    info.append(heading, name);

    const details = [
      product.materiale || '',
      product.secondario && product.secondario !== '000'
        ? product.secondario
        : '',
      product.chiusura && product.chiusura !== '000'
        ? `Chiusura: ${product.chiusura}`
        : ''
    ].filter(Boolean).join(' · ');

    if(details){
      info.append(element('p', 'details', details));
    }

    if(product.note){
      info.append(element('p', 'note', product.note));
    }

    card.append(info, makeGallery(product));
    catalog.append(card);
  });
}

function setupFilters(){
  filters.replaceChildren();

  const categories = [
    ['', 'Tutti'],
    ...Object.entries(labels)
  ];

  categories.forEach(([value, label]) => {
    const button = element('button', 'filter', label);

    button.type = 'button';
    button.setAttribute(
      'aria-pressed',
      String(value === selectedKind)
    );

    button.addEventListener('click', () => {
      selectedKind = value;

      filters.querySelectorAll('button').forEach(item => {
        item.setAttribute(
          'aria-pressed',
          String(item === button)
        );
      });

      render();
    });

    filters.append(button);
  });

  material.replaceChildren();

  const all = element('option', '', 'Tutti i materiali');
  all.value = '';
  material.append(all);

  const materials = [
    ...new Set(
      products.map(product => product.materiale).filter(Boolean)
    )
  ].sort((a, b) => a.localeCompare(b, 'it'));

  materials.forEach(value => {
    const option = element('option', '', value);
    option.value = value;
    material.append(option);
  });

  material.addEventListener('change', render);
}

fetch('./catalogo.json', {cache:'no-cache'})
  .then(response => {
    if(!response.ok){
      throw new Error(
        `catalogo.json non disponibile: HTTP ${response.status}`
      );
    }

    return response.json();
  })
  .then(data => {
    if(!Array.isArray(data)){
      throw new Error('Formato del catalogo non valido');
    }

    products = data
      .filter(product => product && typeof product === 'object')
      .map(product => ({
        ...product,
        foto:Array.isArray(product.foto)
          ? [...new Set(
              product.foto.filter(
                source => typeof source === 'string' && source
              )
            )]
          : [],
        failedPhotos:new Set()
      }));

    setupFilters();
    render();
  })
  .catch(error => {
    statusNode.textContent =
      'Impossibile caricare il catalogo.';

    catalog.replaceChildren(
      element(
        'p',
        'empty',
        `${error.message}. Controlla che catalogo.json sia nella stessa cartella di index.html.`
      )
    );
  });
</script>

</body>
</html>
